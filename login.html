<!DOCTYPE html>
<html lang="en">
<head>
    <title>Arena Login</title>
    <style>
        body { font-family: 'Fira Code', monospace; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #1e293b; padding: 40px; border-radius: 8px; border: 1px solid #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); width: 300px; }
        input { display: block; width: 100%; margin: 15px 0; padding: 10px; border-radius: 4px; border: none; background: #0f172a; color: #38bdf8; outline: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #2563eb; }
        #msg { color: #ef4444; margin-top: 15px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2 style="text-align: center; color: #38bdf8; margin-top: 0;">Competitor Login</h2>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Enter Arena</button>
        <p id="msg"></p>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // Notice: No "http://localhost:3000" here! 
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                
                if (data.token) {
                    localStorage.setItem('arena_token', data.token);
                    localStorage.setItem('arena_user', data.username);
                    window.location.href = 'arena.html'; // Send to the cockpit
                } else {
                    document.getElementById('msg').innerText = data.message || "Login failed.";
                }
            } catch (err) {
                document.getElementById('msg').innerText = "Connection error. Is the server running?";
            }
        }
    </script>
</body>
</html>
