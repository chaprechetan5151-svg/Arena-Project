<!DOCTYPE html>
<html>
<head>
    <title>Arena | Spectator</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
    :root {
        --matrix-green: #10b981;
        --green-glow: 0 0 20px rgba(16, 185, 129, 0.2);
    }
    body { 
        background: #020617; 
        color: var(--matrix-green); 
        padding: 40px; 
        font-family: 'Fira Code', monospace; 
        line-height: 1.5;
    }
    h1 {
        text-transform: uppercase;
        letter-spacing: 4px;
        font-size: 1.5rem;
        margin-bottom: 30px;
        text-shadow: var(--green-glow);
    }
    #view { 
        white-space: pre-wrap; 
        background: rgba(15, 23, 42, 0.8); 
        padding: 40px; 
        border-radius: 15px; 
        min-height: 500px; 
        font-size: 19px; 
        border: 1px solid rgba(16, 185, 129, 0.3);
        box-shadow: var(--green-glow), inset 0 0 20px rgba(0,0,0,0.5);
        position: relative;
    }
    /* Blinking Cursor Effect for the spectator */
    #view::after {
        content: "_";
        animation: blink 1s infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    
</style>
</head>
<body>
    <h1>📺 LIVE Spectator View</h1>
    <div id="view">Waiting for competitor...</div>
    <script>
        const socket = io();
        const view = document.getElementById('view');
        socket.on('live-code-update', (data) => {
            view.innerText = data;
        });
    </script>
</body>
</html>
