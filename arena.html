<!DOCTYPE html>
<html>
<head>
    <title>Arena | Competitor</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
    :root {
        --neon-blue: #38bdf8;
        --neon-glow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    body { 
        margin: 0; 
        background: #020617; 
        color: var(--neon-blue); 
        font-family: 'Fira Code', 'Courier New', monospace; 
        display: flex; 
        flex-direction: column; 
        height: 100vh;
        overflow: hidden;
    }
    header { 
        padding: 1.2rem; 
        background: rgba(30, 41, 59, 0.7); 
        backdrop-filter: blur(10px);
        display: flex; 
        justify-content: space-between; 
        border-bottom: 1px solid rgba(56, 189, 248, 0.3); 
        box-shadow: var(--neon-glow);
        z-index: 10;
    }
    #editor { 
        flex-grow: 1; 
        background: transparent; 
        color: #e2e8f0; 
        padding: 40px; 
        font-size: 18px; 
        border: none; 
        outline: none; 
        resize: none; 
        line-height: 1.6;
        caret-color: #fbbf24; /* Golden cursor */
        text-shadow: 0 0 2px rgba(226, 232, 240, 0.3);
    }
    /* Subtle background grid effect */
    body::before {
        content: "";
        position: absolute;
        width: 100%; height: 100%;
        background-image: linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        pointer-events: none;
    }
</style>
</head>
<body>
    <header>🔴 LIVE ARENA - Type below to broadcast</header>
    <textarea id="editor" placeholder="Start coding..."></textarea>
    <script>
        const socket = io();
        const editor = document.getElementById('editor');
        editor.addEventListener('input', (e) => {
            socket.emit('coding', e.target.value);
        });
    </script>
</body>
</html>
