<!DOCTYPE html>
<html lang="en">
<head>
    <title>The Arena | LIVE</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #0f172a; color: #38bdf8; font-family: 'Fira Code', monospace; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 1rem; background: #1e293b; display: flex; justify-content: space-between; border-bottom: 2px solid #3b82f6; align-items: center; }
        #editor { flex-grow: 1; background: transparent; color: #e2e8f0; padding: 20px; font-size: 18px; border: none; outline: none; resize: none; line-height: 1.5; text-shadow: 0 0 5px rgba(56, 189, 248, 0.5); caret-color: #fbbf24; }
        .status-dot { height: 10px; width: 10px; background: #22c55e; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .btn-submit { background: #ef4444; color: white; border: none; padding: 8px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .btn-submit:hover { background: #dc2626; transform: scale(1.05); }
    </style>
</head>
<body>
    <header>
        <div><span class="status-dot"></span> LIVE ARENA: <span id="user-display">Competitor</span></div>
        <div style="display: flex; gap: 20px; align-items: center;">
            <div id="char-count">Chars: 0</div>
            <button class="btn-submit" onclick="finishMatch(2, 85)">Stop & Submit</button>
        </div>
    </header>
    
    <textarea id="editor" placeholder="Start architecting your solution..."></textarea>

    <script>
        const socket = io('http://localhost:3000');
        const editor = document.getElementById('editor');
        const charCount = document.getElementById('char-count');

        // Display the logged-in user's name
        const savedUser = localStorage.getItem('arena_user') || "Chetan_Dev";
        document.getElementById('user-display').innerText = savedUser;

        // 1. Capture and Emit keystrokes
        editor.addEventListener('input', (e) => {
            const code = e.target.value;
            charCount.innerText = `Chars: ${code.length}`;
            socket.emit('coding', code);
        });

        // 2. The SINGLE Finish Match Function
        async function finishMatch(loserId, score) {
            const token = localStorage.getItem('arena_token');
            
            if (!token) {
                alert("Action Denied: You must be logged in via login.html first!");
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/match-result', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({
                        winner_id: 1, 
                        loser_id: loserId,
                        score: score
                    })
                });

                if (response.ok) {
                    alert("🏆 Victory! Match recorded and ranking updated.");
                    window.location.href = 'leaderboard.html';
                } else {
                    const errorData = await response.json();
                    alert("Submission Failed: " + (errorData.message || "Server Error"));
                }
            } catch (err) {
                console.error("Fetch Error:", err);
                alert("Connection failed. Check your terminal!");
            }
        }
    </script>
</body>
</html>
